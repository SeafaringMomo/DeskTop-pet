# 应用级常量（非敏感，可入库）
# 修改这些值可调整动画节奏、精灵图切分、窗口边距等行为

audio: true              # 是否启用人物语音
bg_music: true           # 是否播放当前角色的背景音乐
static_path: static      # 静态资源根目录（相对项目根）

# 精灵图（Sprite Sheet）配置
# 6×5 = 30 帧，帧索引约定（按行优先）：
#   行 0 基础：0=睁眼 1=闭眼 2=微笑 3=张嘴 4=撇眉 5=半眯眼
#   行 1 强烈：6=大笑 7=红脸 8=眨眼过渡 9=微笑过渡 10=大笑过渡 11=蓄泪
#   行 2 情绪：12=流泪 13=惊讶 14=红脸渐变 15=张大嘴 16=困倦 17=说话
#   行 3 看向：18=看上 19=看下 20=看左 21=看右 22=看左上 23=看右上
#   行 4 看向续：24=看左下 25=看右下 26=看前 27=生气瞪眼 28=得意 29=预留
sprite:
  file: sheet.png        # 精灵图文件名
  cols: 6                # 列数（横向帧数）
  rows: 5                # 行数（纵向帧数）

# 动画参数
animation:
  blink_interval_ms: 3000   # 眨眼间隔毫秒
  default_scale: 0.4        # 默认缩放比例（基础尺寸 300px × 0.4 = 120px 显示）

# 窗口定位
window:
  edge_margin: 20        # 距屏幕边缘的留白像素

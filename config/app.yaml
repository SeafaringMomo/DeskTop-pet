# 应用级常量（非敏感，可入库）
# 修改这些值可调整动画节奏与窗口边距等行为

audio: true              # 是否启用人物语音
bg_music: true           # 是否播放背景音乐（当前角色目录不再强制要求 BGM 文件）
static_path: static      # 静态资源根目录（相对项目根）

# 动画参数：动作改为从角色目录下的子文件夹读取
# 约定：01_idle_breath/ 为原地呼吸循环帧；02_idle_nose_pick/ 为随机扣鼻孔帧
animation:
  frame_interval_ms: 120          # 帧切换间隔（毫秒）
  random_action_interval_ms: 9000 # 随机动作触发间隔（毫秒）

# 窗口定位
window:
  edge_margin: 20        # 距屏幕边缘的留白像素

    description: 索隆最爱的饮料

  - id: fish
    name: 鲜鱼
    icon: 🐟
    price: 15
    satiety_gain: 25
    role_preference:
      默认角色: normal
      索隆: normal
    description: 海上的常见食物

  - id: rice
    name: 米饭
    icon: 🍚
    price: 10
    satiety_gain: 20
    role_preference:
      默认角色: normal
      索隆: normal
    description: 简单的主食

  - id: fruit
    name: 水果
    icon: 🍎
    price: 12
    satiety_gain: 15
    role_preference:
      默认角色: normal
      索隆: disliked
    description: 健康的零食

# 食物定义（非敏感，可入库）
# 食物有：名称、图标、价格、饱食度增益、角色偏好（loved/normal/disliked）

foods:
  - id: meat
    name: 烤肉
    icon: 🍖
    price: 20
    satiety_gain: 30
    role_preference:
      默认角色: loved          # loved ×1.5 好感度加成
      索隆: normal         # normal ×1.0
    description: 默认角色的最爱

  - id: sake
    name: 清酒
    icon: 🍶
    price: 30
    satiety_gain: 20
    role_preference:
      默认角色: disliked       # disliked ×0.2 好感度
